name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve Pages paths
        id: paths
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: npx tsx scripts/pages-paths.ts

      - name: Build dashboard
        env:
          PAGES_DOMAIN: ${{ steps.paths.outputs.pages_domain }}
          BASE_PATH: ${{ steps.paths.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          PAGES_URL: ${{ steps.paths.outputs.pages_url }}
          NEWSLETTER_PROVIDER: ${{ vars.NEWSLETTER_PROVIDER }}
          BUTTONDOWN_USERNAME: ${{ vars.BUTTONDOWN_USERNAME }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
