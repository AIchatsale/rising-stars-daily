name: Rising Stars

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      skip_email:
        description: Skip SMTP delivery even when mail secrets are set
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rising-stars
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve Pages paths
        id: paths
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$repo" = "${owner}.github.io" ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "pages_url=https://${owner}.github.io/" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/${repo}" >> "$GITHUB_OUTPUT"
            echo "pages_url=https://${owner}.github.io/${repo}/" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Collect repositories and rank growth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SKIP_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_email && 'true' || 'false' }}
          PAGES_URL: ${{ steps.paths.outputs.pages_url }}
        run: npm run collect

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: rising stars snapshot $(date -u +%F)"
            git push
          fi

      - name: Build dashboard
        env:
          BASE_PATH: ${{ steps.paths.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
