name: Rising Stars

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      skip_email:
        description: Skip SMTP delivery even when mail secrets are set
        type: boolean
        default: false
      refresh_library:
        description: Full GitHub search for the high-star library
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rising-stars
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve Pages paths
        id: paths
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: npx tsx scripts/pages-paths.ts

      - name: Collect repositories and rank growth
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SKIP_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_email && 'true' || 'false' }}
          NEWSLETTER_PROVIDER: ${{ vars.NEWSLETTER_PROVIDER }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          LIBRARY_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_library && 'true' || 'false' }}
          PAGES_DOMAIN: ${{ steps.paths.outputs.pages_domain }}
          BASE_PATH: ${{ steps.paths.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          PAGES_URL: ${{ steps.paths.outputs.pages_url }}
        run: npm run collect

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: daily snapshot $(date -u +%F)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

  publish:
    needs: collect
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve Pages paths
        id: paths
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
        run: npx tsx scripts/pages-paths.ts

      - name: Build dashboard
        env:
          PAGES_DOMAIN: ${{ steps.paths.outputs.pages_domain }}
          BASE_PATH: ${{ steps.paths.outputs.base_path }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          PAGES_URL: ${{ steps.paths.outputs.pages_url }}
          NEWSLETTER_PROVIDER: ${{ vars.NEWSLETTER_PROVIDER }}
          BUTTONDOWN_USERNAME: ${{ vars.BUTTONDOWN_USERNAME }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
